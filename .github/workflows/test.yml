name: test
on: [push, pull_request]
jobs:
  unit:
    # Ubuntu 24.04 is the reference host. The daemon package alone takes about
    # 42 minutes on a 16-core host; a hosted runner is slower. Its live tests
    # admit against real available memory (soft floor 6 GiB), so use a runner
    # with at least 16 GB of RAM.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DOLT_VERSION: 2.5.1
      DOLT_SHA256: 970927001a0eebd07a51307e784d245bf2e95796a49709e8b8a474ac833bf9a3
      HERDR_VERSION: 0.1.18
      HERDR_SHA256: 5b2f97cb4b2a9d7a6b2cc5942628203ed9fbb7cc0c2b4b09ad8a6f5648e246b7
      # Real host PSI and load are the test default, as on an operator host:
      # the runner is a dedicated VM and scripts/test.sh runs the daemon
      # package alone. Set this repository variable to 1 only if hosted runners
      # prove too noisy; available memory and swap stay real either way.
      FAE_TEST_QUIET_HOST_PRESSURE: ${{ vars.FAE_TEST_QUIET_HOST_PRESSURE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Fae passes a tree to git merge-tree --merge-base, which needs git 2.45.
      - name: Git 2.45 or newer and lsof
        run: |
          have=$(git --version | awk '{print $3}')
          if ! dpkg --compare-versions "$have" ge 2.45; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y git
          fi
          git --version
          command -v lsof || { sudo apt-get update && sudo apt-get install -y lsof; }
      # Without Dolt about half the daemon tests, the listener census and the
      # Dolt controlplane tests skip (FAE-VER-002); several daemon tests look
      # for Herdr (herdr-core: serve, server stop, ls --json, run, get, kill, rm, --version)
      # at ~/.local/bin/herdr-core. Both downloads are pinned by hash.
      - name: Pinned Dolt and Herdr
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o dolt.tar.gz "https://github.com/dolthub/dolt/releases/download/v$DOLT_VERSION/dolt-linux-amd64.tar.gz"
          echo "$DOLT_SHA256  dolt.tar.gz" | sha256sum -c -
          tar -xzf dolt.tar.gz dolt-linux-amd64/bin/dolt
          install -m 0755 dolt-linux-amd64/bin/dolt "$bin/dolt"
          curl -fsSL --retry 3 -o herdr-core.tar.gz "https://releases.herdr.dev/core/$HERDR_VERSION/herdr-core-linux-x86_64.tar.gz"
          echo "$HERDR_SHA256  herdr-core.tar.gz" | sha256sum -c -
          tar -xzf herdr-core.tar.gz herdr-core
          install -m 0755 herdr-core "$bin/herdr-core"
          ln -sf herdr-core "$bin/herdr"
          "$bin/dolt" version | grep -x "dolt version $DOLT_VERSION"
          "$bin/herdr-core" --version | grep -x "hc $HERDR_VERSION"
          echo "$bin" >> "$GITHUB_PATH"
          echo "FAE_TEST_DOLT_BINARY=$bin/dolt" >> "$GITHUB_ENV"
          echo "FAE_TEST_HERDR_BINARY=$bin/herdr-core" >> "$GITHUB_ENV"
      # The later -timeout overrides test.sh's local bounds for a slower runner.
      - run: ./scripts/test.sh -timeout=180m
      # FAE-VER-005: a run where the installed prerequisites silently failed to
      # reach the tests is vacuous for the daemon path.
      - name: No test skipped for a missing Dolt, Herdr or lsof
        run: python3 scripts/count-tests.py --forbid-skip 'FAE_TEST_DOLT_BINARY|[Hh]erdr|lsof not installed' .cache/test.json
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y z3 bison build-essential
      - run: ./scripts/install-verifiers.sh
      - run: ./scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-verification
          path: verification/
